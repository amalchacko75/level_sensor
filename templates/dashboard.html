<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Level Sensor</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- PWA -->
    <meta name="theme-color" content="#071A24">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="apple-mobile-web-app-title"
          content="Level Sensor">

    <link rel="manifest"
          href="/static/manifest.json">

    <link rel="apple-touch-icon"
          href="/static/icons/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        :root{
            --abyss:#071A24;
            --deep:#0E2A38;
            --surface:#12303F;
            --surface-2:#173C4E;
            --line:rgba(127,163,176,.14);
            --aqua:#34D3E0;
            --aqua-deep:#1B9AAF;
            --foam:#EAF7F9;
            --mist:#7FA3B0;
            --coral:#FF6B6B;
            --amber:#FFB454;
        }

        *{ box-sizing:border-box; }

        html,body{ height:100%; }

        body{
            margin:0;
            font-family:"Space Grotesk",Arial,Helvetica,sans-serif;
            background:
                radial-gradient(120% 60% at 50% -10%, #0C2A39 0%, var(--abyss) 60%);
            background-attachment:fixed;
            color:var(--foam);
            -webkit-font-smoothing:antialiased;
        }

        .container{
            width:100%;
            max-width:480px;
            margin:auto;
            padding:22px 16px 40px;
        }

        /* ---------- Dashboard layout ---------- */
        .dashboard{
            display:grid;
            grid-template-columns:1fr;
            gap:14px;
        }
        .dashboard .card{ margin-bottom:0; }

        .col{
            display:flex;
            flex-direction:column;
            gap:14px;
            min-width:0;
        }

        /* Tablet / desktop: widen the page, two independent columns */
        @media (min-width:760px){
            .container{ max-width:920px; padding:32px 24px 48px; }
            .dashboard{
                grid-template-columns:minmax(260px,1fr) 1.35fr;
                grid-template-areas:"left right";
                align-items:start;
            }
            .col-left{ grid-area:left; }
            .col-right{ grid-area:right; }
            .col-right .chart-wrap{ height:360px; }
        }

        /* Large screens: a touch more breathing room */
        @media (min-width:1200px){
            .container{ max-width:1040px; }
        }

        /* ---------- Header ---------- */
        .topbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:22px;
        }

        .topbar h1{
            font-size:19px;
            font-weight:600;
            letter-spacing:.2px;
            margin:0;
            display:flex;
            align-items:center;
            gap:9px;
        }

        .live{
            display:inline-flex;
            align-items:center;
            gap:7px;
            font-family:"Space Mono",monospace;
            font-size:11px;
            letter-spacing:1.5px;
            text-transform:uppercase;
            color:var(--mist);
        }

        .live .dot{
            width:8px; height:8px;
            border-radius:50%;
            background:var(--aqua);
            box-shadow:0 0 0 0 rgba(52,211,224,.6);
            animation:pulse 2.2s infinite;
        }

        @keyframes pulse{
            0%{ box-shadow:0 0 0 0 rgba(52,211,224,.5); }
            70%{ box-shadow:0 0 0 9px rgba(52,211,224,0); }
            100%{ box-shadow:0 0 0 0 rgba(52,211,224,0); }
        }

        /* ---------- Cards ---------- */
        .card{
            background:linear-gradient(180deg,var(--deep),var(--surface));
            border:1px solid var(--line);
            border-radius:18px;
            padding:18px;
            margin-bottom:14px;
        }

        .card-title{
            font-size:12px;
            font-weight:600;
            letter-spacing:1.6px;
            text-transform:uppercase;
            color:var(--mist);
            margin:0 0 14px;
        }

        .readout{
            font-family:"Space Mono",monospace;
            font-weight:700;
            line-height:1;
        }

        /* ---------- Tank hero ---------- */
        .tank-card{
            display:flex;
            gap:20px;
            align-items:stretch;
            padding:20px;
        }

        .tank{
            position:relative;
            width:112px;
            flex:0 0 112px;
            border-radius:16px 16px 12px 12px;
            background:rgba(3,16,22,.55);
            border:2px solid var(--surface-2);
            overflow:hidden;
        }

        .tank-water{
            position:absolute;
            left:0; right:0; bottom:0;
            height:0%;
            background:linear-gradient(180deg,var(--aqua) 0%,var(--aqua-deep) 100%);
            transition:height 1.6s cubic-bezier(.22,.61,.36,1);
        }

        .wave{
            position:absolute;
            top:-13px; left:0;
            width:200%; height:22px;
            display:block;
        }
        .wave path{ fill:var(--aqua); }
        .wave.back{ opacity:.45; top:-9px; }

        .tank-water .wave{ animation:drift 5s linear infinite; }
        .tank-water .wave.back{ animation:drift 8s linear infinite reverse; }

        @keyframes drift{
            from{ transform:translateX(0); }
            to{ transform:translateX(-50%); }
        }

        .tank-ticks{
            position:absolute;
            inset:0;
            pointer-events:none;
        }
        .tank-ticks span{
            position:absolute;
            right:6px;
            font-family:"Space Mono",monospace;
            font-size:9px;
            color:rgba(234,247,249,.45);
            transform:translateY(-50%);
        }
        .tank-ticks span::before{
            content:"";
            position:absolute;
            right:100%;
            top:50%;
            width:9px; height:1px;
            margin-right:4px;
            background:rgba(234,247,249,.28);
        }

        .tank-info{
            flex:1;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .tank-info .label{
            font-size:12px;
            letter-spacing:1.6px;
            text-transform:uppercase;
            color:var(--mist);
            margin-bottom:6px;
        }

        #currentLevel{
            font-family:"Space Mono",monospace;
            font-weight:700;
            font-size:clamp(46px,15vw,62px);
            line-height:.9;
            color:var(--foam);
        }

        .tank-info .sub{
            margin-top:10px;
            font-size:13px;
            color:var(--mist);
        }

        /* ---------- Stat tiles ---------- */
        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:14px;
        }

        .stat .num{
            font-size:30px;
            color:var(--foam);
            margin-bottom:6px;
        }
        .stat .unit{
            font-size:15px;
            color:var(--mist);
            font-weight:400;
        }
        .stat .lab{
            font-size:12px;
            letter-spacing:1.4px;
            text-transform:uppercase;
            color:var(--mist);
        }

        /* battery bar */
        .battery{
            display:flex;
            align-items:center;
            gap:5px;
            margin-top:12px;
        }
        .battery-body{
            flex:1;
            height:12px;
            border-radius:4px;
            background:rgba(3,16,22,.6);
            border:1px solid var(--surface-2);
            overflow:hidden;
        }
        .battery-fill{
            height:100%;
            width:0%;
            border-radius:3px 2px 2px 3px;
            background:var(--aqua);
            transition:width 1.1s ease,background .4s ease;
        }
        .battery-cap{
            width:3px; height:6px;
            border-radius:0 2px 2px 0;
            background:var(--surface-2);
        }

        /* ---------- Chart ---------- */
        .chart-wrap{ height:230px; }

        /* ---------- Events ---------- */
        #events{ display:flex; flex-direction:column; gap:10px; }

        .event{
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px 14px;
            border-radius:12px;
            background:var(--surface-2);
            border-left:3px solid var(--aqua);
        }
        .event.leak{ border-left-color:var(--coral); }
        .event.empty{ border-left-color:var(--amber); }

        .event .type{
            font-family:"Space Mono",monospace;
            font-weight:700;
            font-size:13px;
            letter-spacing:.6px;
        }
        .event.pump  .type{ color:var(--aqua); }
        .event.leak  .type{ color:var(--coral); }
        .event.empty .type{ color:var(--amber); }

        .event .time{
            margin-left:auto;
            font-family:"Space Mono",monospace;
            font-size:12px;
            color:var(--mist);
        }

        .empty-state{
            text-align:center;
            color:var(--mist);
            font-size:14px;
            padding:6px 0 2px;
        }

        /* ---------- Notifications ---------- */
        #enableNotifications{
            width:100%;
            margin-bottom:14px;
            padding:15px;
            border:1px solid var(--surface-2);
            border-radius:14px;
            background:var(--surface);
            color:var(--foam);
            font-family:"Space Grotesk",sans-serif;
            font-size:15px;
            font-weight:600;
            letter-spacing:.3px;
            cursor:pointer;
            transition:border-color .2s ease,background .2s ease;
        }
        #enableNotifications:hover{
            border-color:var(--aqua-deep);
            background:var(--surface-2);
        }

        /* ---------- a11y ---------- */
        :focus-visible{
            outline:2px solid var(--aqua);
            outline-offset:2px;
        }

        @media (prefers-reduced-motion:reduce){
            .tank-water{ transition:none; }
            .wave, .live .dot{ animation:none !important; }
            .battery-fill{ transition:none; }
        }

    </style>

</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="topbar">
        <h1>💧 Level Sensor</h1>
        <span class="live"><span class="dot"></span>Updated <span id="updatedTime">--</span></span>
    </div>

    <!-- Notifications -->
    <button id="enableNotifications">🔔 Turn on alerts</button>

    <div class="dashboard">

    <div class="col col-left">

    <!-- Tank hero -->
    <div class="card tank-card a-tank">

        <div class="tank">
            <div class="tank-water" id="tankWater">
                <svg class="wave back" viewBox="0 0 400 22" preserveAspectRatio="none">
                    <path d="M0,11 C40,1 60,1 100,11 C140,21 160,21 200,11 C240,1 260,1 300,11 C340,21 360,21 400,11 L400,22 L0,22 Z"/>
                </svg>
                <svg class="wave" viewBox="0 0 400 22" preserveAspectRatio="none">
                    <path d="M0,11 C40,1 60,1 100,11 C140,21 160,21 200,11 C240,1 260,1 300,11 C340,21 360,21 400,11 L400,22 L0,22 Z"/>
                </svg>
            </div>
            <div class="tank-ticks">
                <span style="top:8%">100</span>
                <span style="top:33%">75</span>
                <span style="top:58%">50</span>
                <span style="top:83%">25</span>
            </div>
        </div>

        <div class="tank-info">
            <div class="label">Tank level</div>
            <div id="currentLevel">--%</div>
            <div class="sub">of full capacity</div>
        </div>

    </div>

    <!-- Usage -->
    <div class="card stat a-usage">
        <div class="lab">Used today</div>
        <div class="num readout" style="margin-top:8px;">
            <span id="dailyUsage">--</span> <span class="unit">L</span>
        </div>
    </div>

    <!-- Battery + Voltage -->
    <div class="grid a-stats">

        <div class="card stat">
            <div class="num readout"><span id="batteryPercent">--</span><span class="unit">%</span></div>
            <div class="lab">Sensor battery</div>
            <div class="battery">
                <div class="battery-body"><div class="battery-fill" id="batteryFill"></div></div>
                <div class="battery-cap"></div>
            </div>
        </div>

        <div class="card stat">
            <div class="num readout"><span id="batteryVoltage">--</span> <span class="unit">V</span></div>
            <div class="lab">Voltage</div>
        </div>

    </div>

    </div><!-- /col-left -->

    <div class="col col-right">

    <!-- Chart -->
    <div class="card a-chart">
        <div class="card-title">Usage by hour · today</div>
        <div class="chart-wrap">
            <canvas id="usageChart"></canvas>
        </div>
    </div>

    <!-- Events -->
    <div class="card a-events">
        <div class="card-title">Recent activity</div>
        <div id="events"></div>
    </div>

    </div><!-- /col-right -->

    </div>

</div>

<script>

function convertToIST(hour){

    const now=new Date();

    const utc=new Date(Date.UTC(

        now.getUTCFullYear(),

        now.getUTCMonth(),

        now.getUTCDate(),

        hour

    ));

    return utc.toLocaleTimeString(

        "en-IN",

        {

            timeZone:"Asia/Kolkata",

            hour:"2-digit",

            minute:"2-digit",

            hour12:true

        }

    );

}

/* -------------------------
   Updated timestamp (page load)
--------------------------*/

document.getElementById("updatedTime").innerHTML=
    new Date().toLocaleTimeString(
        "en-IN",
        {
            timeZone:"Asia/Kolkata",
            hour:"2-digit",
            minute:"2-digit",
            hour12:true
        }
    );

/* -------------------------
   Hourly Usage
--------------------------*/

fetch("/api/hourly/")

.then(r=>r.json())

.then(data=>{

    const labels=data.map(x=>convertToIST(x.hour));
    const values=data.map(x=>x.usage_liters);

    const canvas=document.getElementById("usageChart");
    const ctx=canvas.getContext("2d");

    const grad=ctx.createLinearGradient(0,0,0,230);
    grad.addColorStop(0,"rgba(52,211,224,.35)");
    grad.addColorStop(1,"rgba(52,211,224,0)");

    new Chart(canvas,{
        type:"line",
        data:{
            labels,
            datasets:[{
                label:"Liters",
                data:values,
                borderColor:"#34D3E0",
                backgroundColor:grad,
                fill:true,
                borderWidth:2,
                tension:.4,
                pointRadius:0,
                pointHoverRadius:5,
                pointBackgroundColor:"#34D3E0"
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{
                legend:{ display:false },
                tooltip:{
                    backgroundColor:"#0E2A38",
                    titleColor:"#EAF7F9",
                    bodyColor:"#EAF7F9",
                    borderColor:"#1B9AAF",
                    borderWidth:1,
                    displayColors:false,
                    padding:10,
                    callbacks:{ label:c=>c.parsed.y+" L" }
                }
            },
            scales:{
                x:{
                    grid:{ color:"rgba(127,163,176,.10)" },
                    ticks:{ color:"#7FA3B0", font:{ size:10 }, maxRotation:0, autoSkipPadding:14 }
                },
                y:{
                    beginAtZero:true,
                    grid:{ color:"rgba(127,163,176,.10)" },
                    ticks:{ color:"#7FA3B0", font:{ size:10 } }
                }
            }
        }
    });

})
.catch(()=>{});

/* -------------------------
   Current Level
--------------------------*/

fetch("/api/current-level/")

.then(r=>r.json())

.then(data=>{

    const level=Math.round(data.level);
    const batt=Math.round(data.battery_percentage);

    document.getElementById("currentLevel").innerHTML=level+"%";
    document.getElementById("batteryPercent").innerHTML=batt;
    document.getElementById("batteryVoltage").innerHTML=
        Number(data.battery_voltage).toFixed(2);

    document.getElementById("tankWater").style.height=data.level+"%";

    const fill=document.getElementById("batteryFill");
    fill.style.width=data.battery_percentage+"%";
    fill.style.background = batt<=15 ? "#FF6B6B" : batt<=30 ? "#FFB454" : "#34D3E0";

})
.catch(()=>{});

/* -------------------------
   Daily Usage
--------------------------*/

fetch("/api/daily/")

.then(r=>r.json())

.then(data=>{

    document.getElementById("dailyUsage").innerHTML=
        Math.round(data.total_usage_liters);

})
.catch(()=>{});

/* -------------------------
   Events
--------------------------*/

fetch("/api/events/")

.then(r=>r.json())

.then(data=>{

    const container=document.getElementById("events");
    container.innerHTML="";

    if(!data || !data.length){
        container.innerHTML=
            '<div class="empty-state">No activity yet today.</div>';
        return;
    }

    data.reverse();

    data.forEach(e=>{

        let cls="pump";
        if(e.type==="leak") cls="leak";
        if(e.type==="empty") cls="empty";

        const time=new Date(e.time)
        .toLocaleTimeString(
            "en-IN",
            {
                timeZone:"Asia/Kolkata",
                hour:"2-digit",
                minute:"2-digit",
                hour12:true
            }
        );

        container.innerHTML+=`
        <div class="event ${cls}">
            <span class="type">${e.type.toUpperCase()}</span>
            <span class="time">🕒 ${time}</span>
        </div>`;

    });

})
.catch(()=>{});

</script>

<!-- Register Service Worker -->

<script>

if("serviceWorker" in navigator){

    navigator.serviceWorker

    .register("/service-worker.js")

    .then(reg=>{

        console.log(

            "Service Worker Registered",

            reg

        );

    });

}

</script>

<!-- Firebase -->

<script
type="module"
src="/static/js/firebase.js">
</script>

</body>

</html>
