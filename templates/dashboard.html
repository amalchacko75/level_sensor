<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Water Tank Monitor</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- PWA -->
    <meta name="theme-color" content="#2196f3">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <meta name="apple-mobile-web-app-title"
          content="Water Monitor">

    <link rel="manifest"
          href="/static/manifest.json">

    <link rel="apple-touch-icon"
          href="/static/icons/icon-192.png">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        *{
            box-sizing:border-box;
        }

        body{

            margin:0;

            font-family:Arial,Helvetica,sans-serif;

            background:#f3f6fb;

            color:#222;
        }

        .container{

            max-width:500px;

            margin:auto;

            padding:15px;
        }

        h2{

            text-align:center;

            margin-bottom:20px;
        }

        .card{

            background:#fff;

            border-radius:14px;

            padding:18px;

            margin-bottom:15px;

            box-shadow:0 3px 10px rgba(0,0,0,.08);
        }

        .grid{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:15px;
        }

        @media(max-width:600px){

            .grid{

                grid-template-columns:1fr;
            }
        }

        .stat{

            text-align:center;
        }

        .stat h3{

            margin:0;

            font-size:26px;
        }

        .stat p{

            margin-top:10px;

            color:#666;
        }

        progress{

            width:100%;

            height:18px;
        }

        #enableNotifications{

            width:100%;

            padding:14px;

            border:none;

            border-radius:8px;

            background:#2196f3;

            color:white;

            font-size:16px;

            cursor:pointer;
        }

        #enableNotifications:hover{

            background:#1976d2;
        }

        .event{

            padding:10px;

            margin-bottom:10px;

            border-radius:8px;

            color:white;
        }

        .pump{

            background:#2196f3;
        }

        .leak{

            background:#f44336;
        }

        .empty{

            background:#ff9800;
        }

    </style>

</head>

<body>

<div class="container">

<h2>💧 Water Tank Monitor</h2>

<!-- Notification Button -->

<div class="card">

<button id="enableNotifications">

🔔 Enable Notifications

</button>

</div>

<!-- Stats -->

<div class="grid">

<div class="card stat">

<h3 id="currentLevel">--%</h3>

<p>💧 Current Level</p>

</div>

<div class="card stat">

<h3 id="dailyUsage">-- L</h3>

<p>🚰 Today's Usage</p>

</div>

<div class="card stat">

<h3 id="batteryPercent">--%</h3>

<p>🔋 Battery</p>

<progress
id="batteryBar"
value="0"
max="100"></progress>

</div>

<div class="card stat">

<h3 id="batteryVoltage">-- V</h3>

<p>⚡ Battery Voltage</p>

</div>

</div>

<!-- Chart -->

<div class="card">

<h3>Today's Water Usage</h3>

<div style="height:300px;">

<canvas id="usageChart"></canvas>

</div>

</div>

<!-- Events -->

<div class="card">

<h3>🚨 Recent Events</h3>

<div id="events"></div>

</div>

</div>

<script>

function convertToIST(hour){

    const now=new Date();

    const utc=new Date(Date.UTC(

        now.getUTCFullYear(),

        now.getUTCMonth(),

        now.getUTCDate(),

        hour

    ));

    return utc.toLocaleTimeString(

        "en-IN",

        {

            timeZone:"Asia/Kolkata",

            hour:"2-digit",

            minute:"2-digit",

            hour12:true

        }

    );

}

/* -------------------------
   Hourly Usage
--------------------------*/

fetch("/api/hourly/")

.then(r=>r.json())

.then(data=>{

    const labels=data.map(

        x=>convertToIST(x.hour)

    );

    const values=data.map(

        x=>x.usage_liters

    );

    new Chart(

        document.getElementById("usageChart"),

        {

            type:"line",

            data:{

                labels,

                datasets:[{

                    label:"Liters",

                    data:values,

                    borderWidth:2,

                    tension:.4

                }]

            },

            options:{

                responsive:true,

                maintainAspectRatio:false

            }

        }

    );

});

/* -------------------------
   Current Level
--------------------------*/

fetch("/api/current-level/")

.then(r=>r.json())

.then(data=>{

    currentLevel.innerHTML=Math.round(data.level)+"%";

    batteryPercent.innerHTML=Math.round(data.battery_percentage)+"%";

    batteryVoltage.innerHTML=

        Number(data.battery_voltage).toFixed(2);

    batteryBar.value=data.battery_percentage;

});

/* -------------------------
   Daily Usage
--------------------------*/

fetch("/api/daily/")

.then(r=>r.json())

.then(data=>{

    dailyUsage.innerHTML=

    Math.round(data.total_usage_liters)+" L";

});

/* -------------------------
   Events
--------------------------*/

fetch("/api/events/")

.then(r=>r.json())

.then(data=>{

    const container=document.getElementById("events");

    container.innerHTML="";

    data.reverse();

    data.forEach(e=>{

        let cls="pump";

        if(e.type==="leak")

            cls="leak";

        if(e.type==="empty")

            cls="empty";

        const time=new Date(e.time)

        .toLocaleTimeString(

            "en-IN",

            {

                timeZone:"Asia/Kolkata",

                hour:"2-digit",

                minute:"2-digit",

                hour12:true

            }

        );

        container.innerHTML+=`

        <div class="event ${cls}">

        <strong>${e.type.toUpperCase()}</strong>

        <br>

        🕒 ${time}

        </div>

        `;

    });

});

</script>

<!-- Register Service Worker -->

<script>

if("serviceWorker" in navigator){

    navigator.serviceWorker

    .register("/service-worker.js")

    .then(reg=>{

        console.log(

            "Service Worker Registered",

            reg

        );

    });

}

</script>

<!-- Firebase -->

<script
type="module"
src="/static/js/firebase.js">
</script>

</body>

</html>
